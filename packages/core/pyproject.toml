[project]
name = "janus-core"
version = "0.1.0"
description = "Shared domain models, comment marker format, and config surface"
requires-python = ">=3.13,<3.14"
# Deliberately empty: `core` is shared code with no I/O dependencies (ticket 04).
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at `janus_core/`, not under a `src/` layer.
module-root = ""
module-name = "janus_core"
