[project]
name = "janus"
version = "0.1.0"
description = "AI-assisted code review for GitLab merge requests"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
janus-core = { workspace = true }

[dependency-groups]
dev = [
    "janus-core",
    "hypothesis>=6.140",
    "pytest>=8.4",
    "ruff>=0.14",
    "ty>=0.0.73",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/core"]
# ruff formats Python inside Markdown code blocks, and `.scratch/` is the decision
# board firstmate maintains, not project source. Linting it would couple `make lint`
# to documents this repo does not own.
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ANN",  # missing annotations
    "PT",   # pytest style
    "TID",  # tidy imports
]

[tool.ruff.lint.per-file-ignores]
# Test helpers are exercised, not called by name, so the return annotation adds nothing.
"**/tests/**" = ["ANN401"]

# ---------------------------------------------------------------- ty

[tool.ty.environment]
python-version = "3.13"

[[tool.ty.overrides]]
# Ticket 04 asked for the strictest type checking on `core` and a looser baseline
# elsewhere. `ty` has no `strict` switch, so the equivalent is promoting every rule
# to error-level under this path and leaving ty's defaults for the rest. `core` owns
# the marker format and the shared models that tickets 03, 06, 07, 09 and 12 all
# depend on, so it is the one place a type error costs real debugging.
include = ["packages/core/**"]

[tool.ty.overrides.rules]
all = "error"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode keeps same-named test modules in different packages from clashing.
addopts = "--import-mode=importlib -q"
